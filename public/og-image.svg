<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f2f2f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ebebeb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007cf0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00dfd8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#50e3c2;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#d3d3d3" opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" fill="url(#dots-pattern)"/>
  
  <!-- Decorative accent line -->
  <rect x="100" y="100" width="1000" height="4" fill="url(#accent-gradient)" rx="2"/>
  
  <!-- Game board visualization -->
  <g transform="translate(200, 150)">
    <!-- Dots grid 5x5 -->
    <g id="dots-grid">
      <circle cx="0" cy="0" r="8" fill="#171717"/>
      <circle cx="80" cy="0" r="8" fill="#171717"/>
      <circle cx="160" cy="0" r="8" fill="#171717"/>
      <circle cx="240" cy="0" r="8" fill="#171717"/>
      <circle cx="320" cy="0" r="8" fill="#171717"/>
      
      <circle cx="0" cy="80" r="8" fill="#171717"/>
      <circle cx="80" cy="80" r="8" fill="#171717"/>
      <circle cx="160" cy="80" r="8" fill="#171717"/>
      <circle cx="240" cy="80" r="8" fill="#171717"/>
      <circle cx="320" cy="80" r="8" fill="#171717"/>
      
      <circle cx="0" cy="160" r="8" fill="#171717"/>
      <circle cx="80" cy="160" r="8" fill="#171717"/>
      <circle cx="160" cy="160" r="8" fill="#171717"/>
      <circle cx="240" cy="160" r="8" fill="#171717"/>
      <circle cx="320" cy="160" r="8" fill="#171717"/>
      
      <circle cx="0" cy="240" r="8" fill="#171717"/>
      <circle cx="80" cy="240" r="8" fill="#171717"/>
      <circle cx="160" cy="240" r="8" fill="#171717"/>
      <circle cx="240" cy="240" r="8" fill="#171717"/>
      <circle cx="320" cy="240" r="8" fill="#171717"/>
      
      <circle cx="0" cy="320" r="8" fill="#171717"/>
      <circle cx="80" cy="320" r="8" fill="#171717"/>
      <circle cx="160" cy="320" r="8" fill="#171717"/>
      <circle cx="240" cy="320" r="8" fill="#171717"/>
      <circle cx="320" cy="320" r="8" fill="#171717"/>
    </g>
    
    <!-- Completed boxes (claimed) -->
    <rect x="4" y="4" width="72" height="72" fill="#0070f3" opacity="0.3" rx="4"/>
    <rect x="84" y="4" width="72" height="72" fill="#0070f3" opacity="0.3" rx="4"/>
    <rect x="164" y="4" width="72" height="72" fill="#eb367f" opacity="0.3" rx="4"/>
    <rect x="244" y="4" width="72" height="72" fill="#eb367f" opacity="0.3" rx="4"/>
    
    <rect x="4" y="84" width="72" height="72" fill="#0070f3" opacity="0.3" rx="4"/>
    <rect x="84" y="84" width="72" height="72" fill="#eb367f" opacity="0.3" rx="4"/>
    <rect x="164" y="84" width="72" height="72" fill="#0070f3" opacity="0.3" rx="4"/>
    <rect x="244" y="84" width="72" height="72" fill="#eb367f" opacity="0.3" rx="4"/>
    
    <!-- Some lines drawn -->
    <g stroke="#171717" stroke-width="4" stroke-linecap="round">
      <line x1="4" y1="80" x2="76" y2="80"/>
      <line x1="84" y1="4" x2="84" y2="76"/>
      <line x1="164" y1="80" x2="236" y2="80"/>
      <line x1="244" y1="4" x2="244" y2="76"/>
      <line x1="4" y1="160" x2="76" y2="160"/>
      <line x1="164" y1="84" x2="164" y2="156"/>
    </g>
  </g>
  
  <!-- Text content -->
  <text x="600" y="140" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="48" font-weight="800" fill="#171717" letter-spacing="-1.5px">Dots and Boxes</text>
  <text x="600" y="195" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="24" font-weight="500" fill="#4d4d4d">Play Free Online • 2 Player • vs AI</text>
  
  <!-- Feature badges -->
  <g transform="translate(600, 500)">
    <g transform="translate(-180, 0)">
      <rect x="0" y="0" width="160" height="50" rx="25" fill="#171717"/>
      <text x="80" y="32" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">No Download</text>
    </g>
    <g transform="translate(20, 0)">
      <rect x="0" y="0" width="160" height="50" rx="25" fill="#171717"/>
      <text x="80" y="32" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Custom Grids</text>
    </g>
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="160" height="50" rx="25" fill="#171717"/>
      <text x="80" y="32" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Track Stats</text>
    </g>
  </g>
  
  <!-- Bottom accent -->
  <rect x="100" y="570" width="1000" height="4" fill="url(#accent-gradient)" rx="2"/>
  
  <!-- URL -->
  <text x="600" y="610" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" fill="#8f8f8f">dotsandboxesgame.com</text>
</svg>